<style>
/* Doodles: small games that are just for fun - no questions, no server.
   Best scores stay on this device (localStorage, keys hl.x.best.*). */
:root{ --bg:#f3f5fb; --card:#fff; --paper:#f7f6f2; --ink:#151a2d; --ink-soft:#5b6380; --rule:#e2e6f2; --bar:#141a33; --acc:#e8590c; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0e1120; --card:#171b2e; --paper:#11141b; --ink:#e7eaf6; --ink-soft:#9aa3c2; --rule:#272d47; --bar:#0a0d1a; } }
:root[data-theme="dark"]{ --bg:#0e1120; --card:#171b2e; --paper:#11141b; --ink:#e7eaf6; --ink-soft:#9aa3c2; --rule:#272d47; --bar:#0a0d1a; }
[hidden]{display:none!important}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.top{background:var(--bar);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 18px}
.top b{font-size:1.15rem} .top .sp{flex:1}
.xbtn{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;
  font:700 22px/1 system-ui,sans-serif;text-decoration:none;border:2px solid rgba(255,255,255,.35);flex:none;cursor:pointer}
.xbtn:hover{background:rgba(255,255,255,.26)} .xbtn:focus-visible{outline:3px solid #fde68a;outline-offset:2px}
main{max-width:980px;margin:0 auto;padding:22px 16px 60px}
h1{margin:0 0 4px} .muted{color:var(--ink-soft);margin:0 0 18px}
.today{display:flex;align-items:center;gap:12px;width:100%;margin:0 0 18px;padding:12px 16px;border:0;cursor:pointer;border-radius:14px;
  font:inherit;color:#fff;text-align:left;background:linear-gradient(100deg,#f08c00,#e8590c 40%,#c2255c);box-shadow:0 8px 24px -12px rgba(232,89,12,.8)}
.today small{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;opacity:.85}
.today b{font-size:1.15rem} .today span.go{margin-left:auto;background:#fff;color:#c2255c;border-radius:999px;padding:6px 16px;font-weight:800}
.today:focus-visible{outline:3px solid #fde68a;outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.pick{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:16px;color:var(--ink);cursor:pointer;font:inherit;transition:transform .15s,border-color .15s}
.pick:hover{transform:translateY(-2px);border-color:var(--acc)} .pick:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.pick .ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:1.7rem}
.pick b{font-size:1.05rem} .pick small{color:var(--ink-soft)} .pick em{font-style:normal;font-size:.8rem;color:var(--acc);font-weight:700}
/* the player */
.game{position:fixed;inset:0;z-index:50;background:rgba(10,12,20,.6);display:grid;place-items:center;padding:16px}
.game-box{background:var(--card);color:var(--ink);border-radius:16px;padding:14px;width:min(440px,100%);box-shadow:0 30px 70px -20px rgba(0,0,0,.7)}
.game-box.wide{width:auto}
.game-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.game-head b{font-size:1.1rem} .game-score{margin-left:auto;font-size:.82rem;color:var(--ink-soft)}
.game-head button{font:inherit;font-size:.9rem;padding:6px 12px;border-radius:10px;border:1px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer}
.game-frame{width:min(92vw,760px);height:min(68vh,560px);border:0;border-radius:12px;background:#000;display:block}
.game-cv{display:block;width:100%;height:auto;aspect-ratio:1;border-radius:10px;border:1px solid var(--rule);touch-action:none;outline:none}
.game-cv:focus-visible{outline:2px solid var(--acc)}
.note{color:var(--ink-soft);font-size:.88rem;margin:10px 0 0}
@media (prefers-reduced-motion: reduce){ .pick{transition:none} .pick:hover{transform:none} }

<script>
/* =====================================================================
   Doodles - Homework Launchpad. GPL-3.0, see LICENSE.
   Open one straight from a link with #snake, #breakout, #mole, #echo,
   #katch, #pairs or #fruit.
   ===================================================================== */
(function(){
  function store(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
  function read(k, d){ try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch(e){ return d; } }
  function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  var GAMES = {
    snake:    { name:"Snake",        icon:"🐍", bg:"#16a34a", says:"Eat the apples, don't eat yourself.", how:"Arrow keys or WASD - or swipe. Eat the apples, don't eat yourself." },
    breakout: { name:"Brick Breaker",icon:"🧱", bg:"#dc2626", says:"Clear every brick.", how:"Move with the arrow keys, the mouse, or your finger. Clear every brick." },
    mole:     { name:"Whack-a-mole", icon:"🔨", bg:"#92400e", says:"30 seconds. Tap them before they hide.", how:"Click or tap the moles before they hide. Gold ones are worth three. 30 seconds." },
    echo:     { name:"Colour Echo",  icon:"🎨", bg:"#7c3aed", says:"Watch, then tap the colours back.", how:"Watch the colours light up, then tap them back in the same order." },
    katch:    { name:"Star Catch",   icon:"⭐", bg:"#0369a1", says:"Catch stars, dodge rocks.", how:"Move with the mouse, the arrow keys or your finger. Catch stars, dodge rocks." },
    pairs:    { name:"Pairs",        icon:"🃏", bg:"#0f766e", says:"Find every matching pair.", how:"Turn two cards at a time and find every matching pair." },
    /* Not a canvas game: the packaged Scratch game, in a frame. It keeps
       its own score. */
    fruit:    { name:"Fruit Slash",  icon:"🍉", bg:"#be123c", says:"Slice the fruit - never the bomb.", how:"Swipe with the mouse to slice the fruit - never the bomb.",
                page:"https://games.civilinitiatives.org/sg-fruit.html" },
    boba:     { name:"Bubble Tea",   icon:"🧋", bg:"#a0522d", says:"Make the drinks your customers order.", how:"Pick a tea, a topping and ice, then Serve - before they lose patience. Keys: 1-4 tea, Q W E topping, I ice, Enter serve." },
    hop:      { name:"Hop Runner",   icon:"🦊", bg:"#d9480f", says:"Jump the hedges. How far can you run?", how:"Space, the up arrow or a tap to jump. Don't bonk a hedge." },
    float:    { name:"Bubble Float", icon:"🫧", bg:"#1c7ed6", says:"Tap to float through the gaps.", how:"Tap or press Space to float up. Don't touch the walls." },
    ttt:      { name:"Noughts & Crosses", icon:"⭕", bg:"#495057", says:"Beat the computer - again and again.", how:"Tap a square (or arrows + Enter, or keys 1-9). How many can you win in a row?" },
    mines:    { name:"Bomb Squad",   icon:"💣", bg:"#364fc7", says:"Open every square that isn't a bomb.", how:"Tap to open. Hold, right-click or turn on flag mode (top right) to flag a bomb. Numbers say how many bombs touch that square." },
    stack:    { name:"Tower Stack",  icon:"🏗️", bg:"#e67700", says:"Drop each block right on top.", how:"Tap or press Space to drop the block. Whatever hangs over the edge falls off." },
    quick:    { name:"Quick Draw",   icon:"⚡", bg:"#2b8a3e", says:"How fast are your reactions?", how:"Wait for green, then tap or press Space as fast as you can. Five rounds - too early scores nothing." }
  };
  var ORDER = ["boba", "snake", "hop", "breakout", "float", "mole", "stack", "echo", "katch", "pairs", "mines", "ttt", "quick", "fruit"];
  var overlay = null;

  function openGame(which){
    if (overlay) overlay.close();
    var g = GAMES[which]; if (!g) return;
    if (location.hash !== "#" + which) history.replaceState(null, "", "#" + which);
    var wrap = el("div", "game"); wrap.setAttribute("role", "dialog"); wrap.setAttribute("aria-label", g.name);
    var box = el("div", "game-box" + (g.page ? " wide" : ""));
    var head = el("div", "game-head");
    var title = el("b", null, g.name), score = el("span", "game-score", "Score 0");
    var close = el("button", null, "Close"); close.type = "button";
    head.appendChild(title); head.appendChild(score); head.appendChild(close);
    var cv, frame = null;
    if (g.page) {
      frame = el("iframe", "game-frame");
      frame.src = g.page; frame.title = g.name; frame.setAttribute("loading", "eager");
      cv = frame; score.hidden = true;
    } else {
      cv = el("canvas", "game-cv"); cv.width = 400; cv.height = 400; cv.tabIndex = 0;
    }
    var foot = el("p", "note", g.how);
    box.appendChild(head); box.appendChild(cv); box.appendChild(foot);
    wrap.appendChild(box); document.body.appendChild(wrap);
    var ctx2 = frame ? null : cv.getContext("2d");
    var bestKey = "hl.x.best." + which, best = read(bestKey, 0);
    var stopFn = null, alive = true;
    function setScore(n){ score.textContent = "Score " + n + (best ? " - best " + best : ""); }
    function finish(n, line){
      if (n > best){ best = n; store(bestKey, n); line = "New best! " + line; }
      setScore(n); foot.textContent = line + " Press Space or tap the board to play again.";
      paint();
    }
    function onEsc(e){ if (e.key === "Escape") api.close(); }
    document.addEventListener("keydown", onEsc);
    var api = overlay = {
      close: function(){
        alive = false; if (stopFn) stopFn();
        document.removeEventListener("keydown", onEsc);
        wrap.remove(); overlay = null;
        history.replaceState(null, "", location.pathname + location.search);
      }
    };
    close.addEventListener("click", api.close);
    wrap.addEventListener("click", function(e){ if (e.target === wrap) api.close(); });
    function colour(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || "#888"; }
    function start(){
      if (!alive) return;
      if (stopFn) stopFn();
      foot.textContent = g.how; setScore(0);
      stopFn = ({ snake:snake, breakout:breakout, mole:mole, echo:echo, katch:katch, pairs:pairs, boba:boba, hop:hop, float:float, ttt:ttt, mines:mines, stack:stack, quick:quick }[which])(cv, ctx2, setScore, finish, colour);
    }
    if (frame) { setTimeout(function(){ frame.focus(); }, 30); return; }
    cv.addEventListener("keydown", function(e){ if (e.key === " " && foot.textContent.indexOf("play again") > 0){ e.preventDefault(); start(); } });
    cv.addEventListener("click", function(){ if (foot.textContent.indexOf("play again") > 0) start(); });
    setTimeout(function(){ cv.focus(); start(); }, 30);
  }

  /* Swipes for phones, shared by Snake and Breakout. */
  function swipes(cv, cb){
    var sx = 0, sy = 0;
    function s(e){ var t = e.touches[0]; sx = t.clientX; sy = t.clientY; }
    function m(e){ e.preventDefault(); cb(e.touches[0].clientX, e.touches[0].clientY, sx, sy); }
    cv.addEventListener("touchstart", s, { passive:true });
    cv.addEventListener("touchmove", m, { passive:false });
    return function(){ cv.removeEventListener("touchstart", s); cv.removeEventListener("touchmove", m); };
  }

  function snake(cv, g, setScore, finish, colour){
    var N = 20, S = cv.width / N, body = [{x:9,y:10},{x:8,y:10},{x:7,y:10}], dir = {x:1,y:0}, want = dir;
    var apple = drop(), score = 0, timer = null, pulse = 0, gap = 130;
    function drop(){ var a; do { a = { x:Math.floor(Math.random()*N), y:Math.floor(Math.random()*N) }; }
      while (body.some(function(b){ return b.x === a.x && b.y === a.y; })); return a; }
    /* Checked against the QUEUED direction: two quick turns inside one
       tick used to let you reverse into your own neck and die unfairly. */
    function turn(x, y){ if (x !== -want.x || y !== -want.y) want = { x:x, y:y }; }
    function key(e){
      var k = e.key.toLowerCase(), m = { arrowup:[0,-1], w:[0,-1], arrowdown:[0,1], s:[0,1], arrowleft:[-1,0], a:[-1,0], arrowright:[1,0], d:[1,0] }[k];
      if (m){ e.preventDefault(); turn(m[0], m[1]); }
    }
    cv.addEventListener("keydown", key);
    var unswipe = swipes(cv, function(x, y, sx, sy){
      var dx = x - sx, dy = y - sy;
      if (Math.abs(dx) + Math.abs(dy) < 24) return;
      if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0); else turn(0, dy > 0 ? 1 : -1);
    });
    function round(x, y, w, h, r){
      g.beginPath();
      if (g.roundRect) g.roundRect(x, y, w, h, r); else g.rect(x, y, w, h);
      g.fill();
    }
    function draw(){
      g.fillStyle = colour("--paper"); g.fillRect(0, 0, cv.width, cv.height);
      /* a faint board, so the squares read as squares */
      g.strokeStyle = "rgba(127,127,127,.10)"; g.lineWidth = 1;
      for (var i = 1; i < N; i++){
        g.beginPath(); g.moveTo(i*S, 0); g.lineTo(i*S, cv.width); g.stroke();
        g.beginPath(); g.moveTo(0, i*S); g.lineTo(cv.width, i*S); g.stroke();
      }
      /* the apple breathes a little, so the eye finds it at once */
      var r = S*0.36 + Math.sin(pulse/6) * S*0.04;
      g.fillStyle = "#e03131";
      g.beginPath(); g.arc(apple.x*S + S/2, apple.y*S + S/2, r, 0, Math.PI*2); g.fill();
      g.fillStyle = "#2f9e44";
      g.beginPath(); g.ellipse(apple.x*S + S/2 + r*0.5, apple.y*S + S/2 - r*0.9, r*0.42, r*0.2, -0.6, 0, Math.PI*2); g.fill();
      body.forEach(function(b, i){
        g.fillStyle = i ? "#2f9e44" : "#1b7a31";
        round(b.x*S + 1.5, b.y*S + 1.5, S - 3, S - 3, i ? 4 : 6);
      });
      /* eyes, looking the way you're going */
      var h = body[0], cx = h.x*S + S/2, cy = h.y*S + S/2, o = S*0.17;
      g.fillStyle = "#ffffff";
      g.beginPath(); g.arc(cx + dir.y*o - dir.x*o*0.2, cy + dir.x*o - dir.y*o*0.2, S*0.13, 0, Math.PI*2);
      g.arc(cx - dir.y*o - dir.x*o*0.2, cy - dir.x*o - dir.y*o*0.2, S*0.13, 0, Math.PI*2); g.fill();
      g.fillStyle = "#10281a";
      g.beginPath(); g.arc(cx + dir.y*o + dir.x*o*0.3, cy + dir.x*o + dir.y*o*0.3, S*0.07, 0, Math.PI*2);
      g.arc(cx - dir.y*o + dir.x*o*0.3, cy - dir.x*o + dir.y*o*0.3, S*0.07, 0, Math.PI*2); g.fill();
    }
    function step(){
      dir = want; pulse++;
      var h = { x: body[0].x + dir.x, y: body[0].y + dir.y };
      if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || body.some(function(b){ return b.x === h.x && b.y === h.y; })){
        clearInterval(timer); timer = null; draw(); finish(score, "Game over - " + score + (score === 1 ? " apple." : " apples.")); return;
      }
      body.unshift(h);
      if (h.x === apple.x && h.y === apple.y){
        score++; setScore(score); apple = drop();
        /* it quickens as you grow, down to a brisk floor */
        var faster = Math.max(70, 130 - score * 4);
        if (faster !== gap){ gap = faster; clearInterval(timer); timer = setInterval(step, gap); }
      } else body.pop();
      draw();
    }
    draw(); timer = setInterval(step, gap);
    return function(){ if (timer) clearInterval(timer); cv.removeEventListener("keydown", key); unswipe(); };
  }

  function breakout(cv, g, setScore, finish, colour){
    var W = cv.width, H = cv.height, padW = 74, px = W/2 - padW/2, ball = fresh();
    var rows = 5, cols = 8, bw = W/cols, bh = 18, bricks = [], score = 0, keys = {}, raf = 0, lives = 3;
    var trail = [], shake = 0, last = 0, carry = 0, STEP = 1000/60;
    for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) bricks.push({ x:c*bw, y:40 + r*bh, on:true, r:r });
    var hues = ["#e03131","#f08c00","#f2c200","#2f9e44","#1c7ed6"];
    function fresh(){ return { x:W/2, y:H-60, vx:3, vy:-3.4, r:6 }; }
    function kd(e){ keys[e.key] = true; if (/Arrow/.test(e.key)) e.preventDefault(); }
    function ku(e){ keys[e.key] = false; }
    function mm(e){ var r = cv.getBoundingClientRect(); px = (e.clientX - r.left) * W / r.width - padW/2; }
    function blur(){ keys = {}; }
    cv.addEventListener("keydown", kd); cv.addEventListener("keyup", ku); cv.addEventListener("mousemove", mm);
    window.addEventListener("blur", blur);
    var unswipe = swipes(cv, function(x){ var r = cv.getBoundingClientRect(); px = (x - r.left) * W / r.width - padW/2; });

    /* One brick, checked properly: which side the ball came in by
       decides which way it leaves, so it can't slip through a corner. */
    function hitBrick(b){
      var nx = Math.max(b.x, Math.min(ball.x, b.x + bw)), ny = Math.max(b.y, Math.min(ball.y, b.y + bh));
      var dx = ball.x - nx, dy = ball.y - ny;
      if (dx*dx + dy*dy > ball.r*ball.r) return false;
      if (Math.abs(dx) > Math.abs(dy)) { ball.vx = Math.abs(ball.vx) * (dx < 0 ? -1 : 1); ball.x = nx + (dx < 0 ? -ball.r : ball.r); }
      else { ball.vy = Math.abs(ball.vy) * (dy < 0 ? -1 : 1); ball.y = ny + (dy < 0 ? -ball.r : ball.r); }
      return true;
    }
    function tick(){
      if (keys.ArrowLeft || keys.a || keys.A) px -= 7;
      if (keys.ArrowRight || keys.d || keys.D) px += 7;
      px = Math.max(0, Math.min(W - padW, px));
      ball.x += ball.vx; ball.y += ball.vy;
      trail.push({ x:ball.x, y:ball.y }); if (trail.length > 9) trail.shift();
      if (ball.x < ball.r){ ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
      if (ball.x > W - ball.r){ ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
      if (ball.y < ball.r){ ball.y = ball.r; ball.vy = Math.abs(ball.vy); }
      /* the paddle: where it hits decides the angle, and it never
         catches the ball twice on the way up */
      if (ball.vy > 0 && ball.y + ball.r > H - 24 && ball.y < H - 10 && ball.x > px - 4 && ball.x < px + padW + 4){
        ball.y = H - 24 - ball.r; ball.vy = -Math.abs(ball.vy);
        ball.vx = ((ball.x - (px + padW/2)) / (padW/2)) * 4.4;
        var sp = Math.min(7.5, Math.hypot(ball.vx, ball.vy) + 0.12);
        var a = Math.atan2(ball.vy, ball.vx); ball.vx = Math.cos(a)*sp; ball.vy = Math.sin(a)*sp;
      }
      for (var i = 0; i < bricks.length; i++){
        var b = bricks[i];
        if (b.on && hitBrick(b)){ b.on = false; score += 5 - b.r; setScore(score); shake = 5; break; }
      }
      if (ball.y - ball.r > H){
        if (--lives <= 0){ draw(); finish(score, "Out of balls - " + score + " points."); return false; }
        ball = fresh(); trail = [];
      }
      if (!bricks.some(function(b){ return b.on; })){ draw(); finish(score, "Cleared it! " + score + " points."); return false; }
      return true;
    }
    /* A fixed step, so the game runs at the same speed on a 60Hz
       screen and a 120Hz one. */
    function frame(now){
      if (!last) last = now;
      carry += Math.min(100, now - last); last = now;
      while (carry >= STEP){ if (!tick()) return; carry -= STEP; }
      draw(); raf = requestAnimationFrame(frame);
    }
    function draw(){
      g.save();
      if (shake > 0){ g.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake); shake -= 0.6; }
      g.fillStyle = colour("--paper"); g.fillRect(-8, -8, W + 16, H + 16);
      bricks.forEach(function(b){
        if (!b.on) return;
        g.fillStyle = hues[b.r];
        g.beginPath();
        if (g.roundRect) g.roundRect(b.x + 2, b.y + 2, bw - 4, bh - 4, 4); else g.rect(b.x + 2, b.y + 2, bw - 4, bh - 4);
        g.fill();
        g.fillStyle = "rgba(255,255,255,.28)"; g.fillRect(b.x + 5, b.y + 5, bw - 10, 3);
      });
      trail.forEach(function(t, i){
        g.globalAlpha = (i + 1) / trail.length * 0.33;
        g.fillStyle = colour("--ink");
        g.beginPath(); g.arc(t.x, t.y, ball.r * (0.4 + i/trail.length*0.5), 0, Math.PI*2); g.fill();
      });
      g.globalAlpha = 1;
      g.fillStyle = colour("--ink");
      g.beginPath();
      if (g.roundRect) g.roundRect(px, H - 24, padW, 9, 5); else g.rect(px, H - 24, padW, 9);
      g.fill();
      g.beginPath(); g.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); g.fill();
      g.font = "bold 12px sans-serif";
      g.fillText("Balls: " + lives, 8, 20);
      g.restore();
    }
    raf = requestAnimationFrame(frame);
    return function(){ cancelAnimationFrame(raf); cv.removeEventListener("keydown", kd);
      cv.removeEventListener("keyup", ku); cv.removeEventListener("mousemove", mm);
      window.removeEventListener("blur", blur); unswipe(); };
  }

  function mole(cv, g, setScore, finish, colour){
    var W = cv.width, holes = [], score = 0, ends = performance.now() + 30000, raf = 0, nextPop = 0;
    var puffs = [], streak = 0, best = 0;
    for (var r = 0; r < 3; r++) for (var c = 0; c < 3; c++) holes.push({ x:70 + c*130, y:90 + r*120, up:0, hit:0, gold:false });
    function click(e){
      var rc = cv.getBoundingClientRect(), x = (e.clientX - rc.left) * W / rc.width, y = (e.clientY - rc.top) * W / rc.height;
      var now = performance.now(), got = false;
      holes.forEach(function(h){
        if (h.up > now && !h.hit && Math.hypot(x - h.x, y - (h.y - 18)) < 38){
          h.hit = now; h.up = now + 260; got = true;
          streak++; if (streak > best) best = streak;
          /* a golden mole is worth three, and a run of hits adds one more */
          score += (h.gold ? 3 : 1) + (streak >= 3 ? 1 : 0);
          setScore(score);
          puffs.push({ x:h.x, y:h.y - 30, t:now, gold:h.gold });
        }
      });
      /* a swing at nothing breaks the run */
      if (!got) streak = 0;
    }
    cv.addEventListener("pointerdown", click);
    function frame(now){
      if (now > ends){ draw(now); finish(score, "Time! " + score + " points, best run " + best + "."); return; }
      if (now > nextPop){
        var free = holes.filter(function(h){ return h.up < now; });
        if (free.length){
          var h = free[Math.floor(Math.random()*free.length)];
          h.gold = Math.random() < 0.16;
          h.up = now + (h.gold ? 620 : 700) + Math.random()*600; h.hit = 0;
        }
        nextPop = now + 380 + Math.random()*420 - Math.min(250, score*6);
      }
      draw(now); raf = requestAnimationFrame(frame);
    }
    function draw(now){
      g.fillStyle = "#8fd46a"; g.fillRect(0, 0, W, W);
      /* a few tufts of grass, so it isn't a flat green square */
      g.strokeStyle = "rgba(32,94,32,.25)"; g.lineWidth = 2;
      for (var i = 0; i < 26; i++){
        var gx = (i * 71) % W, gy = 30 + ((i * 133) % (W - 50));
        g.beginPath(); g.moveTo(gx, gy); g.lineTo(gx + 3, gy - 9); g.stroke();
      }
      var left = Math.max(0, (ends - now) / 30000);
      g.fillStyle = "rgba(0,0,0,.18)"; g.fillRect(10, 30, W - 20, 7);
      g.fillStyle = left < 0.25 ? "#e03131" : "#1b2430";
      g.fillRect(10, 30, (W - 20) * left, 7);
      g.fillStyle = "#1b2430"; g.font = "bold 14px sans-serif";
      g.fillText("Time " + Math.max(0, Math.ceil((ends - now)/1000)) + "s", 10, 22);
      if (streak >= 3){ g.fillStyle = "#b54708"; g.fillText("Run of " + streak + "!", W - 96, 22); }
      holes.forEach(function(h){
        g.fillStyle = "#5b3a1e"; g.beginPath(); g.ellipse(h.x, h.y + 10, 46, 16, 0, 0, Math.PI*2); g.fill();
        g.fillStyle = "rgba(0,0,0,.25)"; g.beginPath(); g.ellipse(h.x, h.y + 7, 38, 11, 0, 0, Math.PI*2); g.fill();
        if (h.up > now){
          /* it rises out of the hole rather than snapping into place */
          var life = h.up - now, rise = h.hit ? 10 : Math.min(1, (1 - Math.min(1, life / 900)) * 4 + 0.35) * 22;
          g.save(); g.translate(0, 22 - rise);
          g.fillStyle = h.hit ? "#c9a27e" : (h.gold ? "#e8b923" : "#8a5a3b");
          g.beginPath(); g.arc(h.x, h.y - 14, 30, Math.PI, 0); g.rect(h.x - 30, h.y - 14, 60, 22); g.fill();
          g.fillStyle = h.gold ? "#fff3c4" : "#c9a27e";
          g.beginPath(); g.ellipse(h.x, h.y - 6, 17, 12, 0, 0, Math.PI*2); g.fill();
          g.fillStyle = "#1b2430";
          g.beginPath(); g.arc(h.x - 10, h.y - 22, 3.4, 0, Math.PI*2); g.arc(h.x + 10, h.y - 22, 3.4, 0, Math.PI*2); g.fill();
          g.fillStyle = "#f783ac"; g.beginPath(); g.arc(h.x, h.y - 12, 5, 0, Math.PI*2); g.fill();
          g.restore();
        }
      });
      puffs = puffs.filter(function(p){ return now - p.t < 520; });
      puffs.forEach(function(p){
        var k = (now - p.t) / 520;
        g.globalAlpha = 1 - k;
        g.fillStyle = p.gold ? "#b54708" : "#1b2430";
        g.font = "bold " + (17 + k*9) + "px sans-serif";
        var word = p.gold ? "+3!" : "BONK";
        g.fillText(word, p.x - g.measureText(word).width/2, p.y - k*26);
        g.globalAlpha = 1;
      });
    }
    raf = requestAnimationFrame(frame);
    return function(){ cancelAnimationFrame(raf); cv.removeEventListener("pointerdown", click); };
  }
  /* ---------- Colour Echo: watch the pattern, play it back ---------- */
  function echo(cv, g, setScore, finish, colour){
    var W = cv.width, pads = [
      { c:"#e03131", lit:"#ff8787", x:0, y:0 }, { c:"#1c7ed6", lit:"#74c0fc", x:1, y:0 },
      { c:"#2f9e44", lit:"#8ce99a", x:0, y:1 }, { c:"#f2b200", lit:"#ffe066", x:1, y:1 }
    ];
    var seq = [], step = 0, showing = true, flash = -1, flashUntil = 0, raf = 0, round = 0;
    var next = performance.now() + 600, idx = 0, dead = false;
    /* Sized to fit BOTH ways: the header eats 54px of height, so the
       pads take whichever of the two budgets is smaller, then sit in
       the middle of what's left. */
    var M = 18, TOP = 54;
    var S = Math.min((W - M*3) / 2, (W - TOP - M*3) / 2);
    var ox = (W - (S*2 + M)) / 2, oy = TOP + (W - TOP - (S*2 + M)) / 2;
    pads.forEach(function(p){ p.px = ox + p.x*(S + M); p.py = oy + p.y*(S + M); });
    function grow(){ seq.push(Math.floor(Math.random()*4)); round++; showing = true; idx = 0; next = performance.now() + 420; }
    function at(x, y){
      for (var i = 0; i < 4; i++){ var p = pads[i];
        if (x >= p.px && x <= p.px + S && y >= p.py && y <= p.py + S) return i; }
      return -1;
    }
    function click(e){
      if (showing || dead) return;
      var rc = cv.getBoundingClientRect();
      var i = at((e.clientX - rc.left) * W / rc.width, (e.clientY - rc.top) * W / rc.height);
      if (i < 0) return;
      flash = i; flashUntil = performance.now() + 180;
      if (i === seq[step]){
        step++;
        if (step >= seq.length){ setScore(round); step = 0; setTimeout(grow, 420); }
      } else {
        dead = true;
        finish(round - 1, "Wrong colour - you reached round " + round + ".");
      }
    }
    cv.addEventListener("pointerdown", click);
    function frame(now){
      if (showing && now > next){
        if (idx < seq.length){ flash = seq[idx]; flashUntil = now + 340; idx++; next = now + 520; }
        else { showing = false; flash = -1; }
      }
      if (now > flashUntil && !showing) flash = -1;
      if (now > flashUntil && showing && flash >= 0 && now > flashUntil) flash = -1;
      draw(now);
      if (!dead) raf = requestAnimationFrame(frame);
    }
    function draw(now){
      g.fillStyle = colour("--paper"); g.fillRect(0, 0, W, W);
      g.fillStyle = colour("--ink"); g.font = "bold 20px sans-serif";
      g.fillText("Round " + Math.max(1, round), 18, 34);
      g.font = "13px sans-serif"; g.globalAlpha = .7;
      g.fillText(showing ? "Watch..." : "Your turn", W - 92, 34);
      g.globalAlpha = 1;
      pads.forEach(function(p, i){
        g.fillStyle = (flash === i && now < flashUntil) ? p.lit : p.c;
        g.beginPath();
        if (g.roundRect) g.roundRect(p.px, p.py, S, S, 16); else g.rect(p.px, p.py, S, S);
        g.fill();
      });
    }
    grow(); raf = requestAnimationFrame(frame);
    return function(){ cancelAnimationFrame(raf); cv.removeEventListener("pointerdown", click); };
  }

  /* ---------- Star Catch: a basket, falling stars, dodge the rocks ---------- */
  function katch(cv, g, setScore, finish, colour){
    var W = cv.width, H = cv.height, bx = W/2, bw = 84, score = 0, lives = 3;
    var drops = [], raf = 0, keys = {}, last = 0, carry = 0, STEP = 1000/60, spawn = 0, fall = 2.6;
    function kd(e){ keys[e.key] = true; if (/Arrow/.test(e.key)) e.preventDefault(); }
    function ku(e){ keys[e.key] = false; }
    function mm(e){ var r = cv.getBoundingClientRect(); bx = (e.clientX - r.left) * W / r.width; }
    function blur(){ keys = {}; }
    cv.addEventListener("keydown", kd); cv.addEventListener("keyup", ku); cv.addEventListener("mousemove", mm);
    window.addEventListener("blur", blur);
    var unswipe = swipes(cv, function(x){ var r = cv.getBoundingClientRect(); bx = (x - r.left) * W / r.width; });
    function star(g2, x, y, r, fill){
      g2.fillStyle = fill; g2.beginPath();
      for (var i = 0; i < 10; i++){
        var rr = i % 2 ? r*0.46 : r, a = -Math.PI/2 + i*Math.PI/5;
        g2[i ? "lineTo" : "moveTo"](x + Math.cos(a)*rr, y + Math.sin(a)*rr);
      }
      g2.closePath(); g2.fill();
    }
    function tick(now){
      if (keys.ArrowLeft || keys.a) bx -= 7;
      if (keys.ArrowRight || keys.d) bx += 7;
      bx = Math.max(bw/2, Math.min(W - bw/2, bx));
      if (now > spawn){
        drops.push({ x: 30 + Math.random()*(W - 60), y: -20, rock: Math.random() < 0.26, spin: Math.random()*6 });
        spawn = now + Math.max(260, 760 - score*9);
        fall = Math.min(6.5, 2.6 + score*0.05);
      }
      for (var i = drops.length - 1; i >= 0; i--){
        var d = drops[i]; d.y += fall; d.spin += 0.05;
        if (d.y > H - 46 && d.y < H - 8 && Math.abs(d.x - bx) < bw/2 + 8){
          drops.splice(i, 1);
          if (d.rock){ if (--lives <= 0){ draw(now); finish(score, "A rock got you - " + score + " stars."); return false; } }
          else { score++; setScore(score); }
        } else if (d.y > H + 24){
          drops.splice(i, 1);
          if (!d.rock && --lives <= 0){ draw(now); finish(score, "Three stars missed - " + score + " caught."); return false; }
        }
      }
      return true;
    }
    function frame(now){
      if (!last) last = now;
      carry += Math.min(100, now - last); last = now;
      while (carry >= STEP){ if (!tick(now)) return; carry -= STEP; }
      draw(now); raf = requestAnimationFrame(frame);
    }
    function draw(now){
      var sky = g.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, "#1b1b3a"); sky.addColorStop(1, "#3b2a5a");
      g.fillStyle = sky; g.fillRect(0, 0, W, H);
      for (var i = 0; i < 30; i++){
        g.globalAlpha = 0.25 + ((i * 37) % 10) / 20;
        g.fillStyle = "#ffffff";
        g.fillRect((i * 97) % W, (i * 53) % (H - 60), 2, 2);
      }
      g.globalAlpha = 1;
      drops.forEach(function(d){
        if (d.rock){
          g.save(); g.translate(d.x, d.y); g.rotate(d.spin);
          g.fillStyle = "#6b7280"; g.beginPath();
          g.moveTo(-11, 3); g.lineTo(-5, -10); g.lineTo(8, -8); g.lineTo(12, 4); g.lineTo(2, 11); g.closePath(); g.fill();
          g.restore();
        } else star(g, d.x, d.y, 12, "#ffd93d");
      });
      /* the basket */
      g.fillStyle = "#b45309";
      g.beginPath();
      g.moveTo(bx - bw/2, H - 40); g.lineTo(bx + bw/2, H - 40);
      g.lineTo(bx + bw/2 - 10, H - 10); g.lineTo(bx - bw/2 + 10, H - 10); g.closePath(); g.fill();
      g.fillStyle = "#92400e"; g.fillRect(bx - bw/2 - 3, H - 44, bw + 6, 7);
      g.fillStyle = "#ffffff"; g.font = "bold 14px sans-serif";
      g.fillText("Lives " + lives, 10, 24);
    }
    raf = requestAnimationFrame(frame);
    return function(){ cancelAnimationFrame(raf); cv.removeEventListener("keydown", kd);
      cv.removeEventListener("keyup", ku); cv.removeEventListener("mousemove", mm);
      window.removeEventListener("blur", blur); unswipe(); };
  }

  /* ---------- Pairs: turn two cards, find the match ---------- */
  function pairs(cv, g, setScore, finish, colour){
    var W = cv.width, N = 4, M = 14, TOP = 44;
    var S = Math.min((W - M*(N+1)) / N, (W - TOP - M*(N+1)) / N);
    var OX = (W - (S*N + M*(N-1))) / 2, OY = TOP + (W - TOP - (S*N + M*(N-1))) / 2;
    var icons = ["★","▲","●","♥","♪","❖","■","✿"];
    var deck = [], first = null, second = null, lock = 0, found = 0, turns = 0, raf = 0, done = false;
    icons.concat(icons).forEach(function(s){ deck.push({ s:s, up:false, gone:false }); });
    for (var i = deck.length - 1; i > 0; i--){ var j = Math.floor(Math.random()*(i+1)); var t = deck[i]; deck[i] = deck[j]; deck[j] = t; }
    deck.forEach(function(c, i){ c.cx = OX + (i % N)*(S + M); c.cy = OY + Math.floor(i / N)*(S + M); });
    var hues = ["#e03131","#1c7ed6","#2f9e44","#f2b200","#7c3aed","#0ca678","#f06595","#fd7e14"];
    deck.forEach(function(c){ c.hue = hues[icons.indexOf(c.s)]; });
    function click(e){
      if (lock > performance.now() || done) return;
      var rc = cv.getBoundingClientRect();
      var x = (e.clientX - rc.left) * W / rc.width, y = (e.clientY - rc.top) * W / rc.height;
      deck.forEach(function(c){
        if (c.gone || c.up) return;
        if (x < c.cx || x > c.cx + S || y < c.cy || y > c.cy + S) return;
        c.up = true;
        if (!first) { first = c; return; }
        second = c; turns++;
        if (first.s === second.s){
          first.gone = second.gone = true; found++; setScore(found);
          first = second = null;
          if (found === icons.length){ done = true; finish(found, "All matched in " + turns + " turns!"); }
        } else {
          lock = performance.now() + 700;
          var a = first, b = second; first = second = null;
          setTimeout(function(){ a.up = b.up = false; }, 700);
        }
      });
    }
    cv.addEventListener("pointerdown", click);
    function frame(){
      g.fillStyle = colour("--paper"); g.fillRect(0, 0, W, W);
      g.fillStyle = colour("--ink"); g.font = "bold 19px sans-serif";
      g.fillText("Pairs found " + found + " / " + icons.length, 14, 30);
      g.font = "13px sans-serif"; g.globalAlpha = .7;
      g.fillText("Turns " + turns, W - 78, 30); g.globalAlpha = 1;
      deck.forEach(function(c){
        if (c.gone){
          g.globalAlpha = .18;
          g.fillStyle = c.hue;
          g.beginPath();
          if (g.roundRect) g.roundRect(c.cx, c.cy, S, S, 12); else g.rect(c.cx, c.cy, S, S);
          g.fill(); g.globalAlpha = 1; return;
        }
        g.fillStyle = c.up ? c.hue : "#4c6ef5";
        g.beginPath();
        if (g.roundRect) g.roundRect(c.cx, c.cy, S, S, 12); else g.rect(c.cx, c.cy, S, S);
        g.fill();
        if (c.up){
          g.fillStyle = "#ffffff"; g.font = "bold " + Math.round(S*0.52) + "px sans-serif";
          g.fillText(c.s, c.cx + S/2 - g.measureText(c.s).width/2, c.cy + S*0.68);
        } else {
          g.strokeStyle = "rgba(255,255,255,.35)"; g.lineWidth = 3;
          g.beginPath(); g.arc(c.cx + S/2, c.cy + S/2, S*0.22, 0, Math.PI*2); g.stroke();
        }
      });
      if (!done) raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);
    return function(){ cancelAnimationFrame(raf); cv.removeEventListener("pointerdown", click); };
  }



  /* ==================================================================
     More doodles (27 Oct). Same shape as the ones above: each takes
     (canvas, 2d context, setScore, finish, colour) and returns a
     function that stops it.

  /* Where a pointer event landed, in canvas pixels. */
  function pt(cv, e){
    var r = cv.getBoundingClientRect();
    return { x:(e.clientX - r.left) * cv.width / r.width, y:(e.clientY - r.top) * cv.height / r.height };
  }
  function rrect(g, x, y, w, h, r){
    g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }

  /* ---------- Bubble Tea: make what the customer orders ---------- */
  function boba(cv, g, setScore, finish, colour){
    var TEAS = [
      { name:"Milk tea",   c:"#c8a27a" }, { name:"Green tea",  c:"#9fcf6b" },
      { name:"Taro",       c:"#b79ad6" }, { name:"Strawberry", c:"#f29bb2" }
    ];
    var TOPS = [
      { name:"Pearls",  c:"#3b2416" }, { name:"Popping", c:"#f59f00" }, { name:"Jelly", c:"#e8f3a0" }
    ];
    var ICE = ["No ice", "Ice"];
    var score = 0, lives = 3, ends = performance.now() + 60000, done = false, raf = 0;
    var cup = { tea:-1, top:-1, ice:-1 }, order = null, flash = null, patience = 0;
    var NAMES = ["Ava", "Leo", "Mia", "Sam", "Zara", "Raj", "Nia", "Tom", "Isla", "Kai", "Priya", "Ben"];

    function newOrder(){
      order = { tea:Math.floor(Math.random()*4), top:Math.floor(Math.random()*3), ice:Math.floor(Math.random()*2),
                who:NAMES[Math.floor(Math.random()*NAMES.length)], at:performance.now() };
      patience = Math.max(7000, 15000 - score * 400);   // they get less patient as you get better
      cup = { tea:-1, top:-1, ice:-1 };
    }
    /* The buttons along the bottom. */
    var B = [];
    TEAS.forEach(function(t, i){ B.push({ x:10 + i*96, y:290, w:88, h:40, kind:"tea", i:i, label:t.name, c:t.c }); });
    TOPS.forEach(function(t, i){ B.push({ x:10 + i*96, y:338, w:88, h:40, kind:"top", i:i, label:t.name, c:t.c }); });
    B.push({ x:298, y:338, w:42, h:40, kind:"ice", label:"🧊" });
    B.push({ x:346, y:338, w:44, h:40, kind:"bin", label:"🗑" });
    B.push({ x:250, y:200, w:140, h:44, kind:"serve", label:"Serve" });

    function serve(){
      if (cup.tea < 0 || cup.top < 0) { flash = { text:"Not finished!", c:"#e03131", at:performance.now() }; return; }
      var ice = cup.ice < 0 ? 0 : cup.ice;
      if (cup.tea === order.tea && cup.top === order.top && ice === order.ice) {
        score++; setScore(score);
        flash = { text:"Thank you! 😊", c:"#2f9e44", at:performance.now() };
      } else {
        lives--; flash = { text:"That's not my order 😕", c:"#e03131", at:performance.now() };
      }
      newOrder();
    }
    function press(b){
      if (done) return;
      if (b.kind === "tea") cup.tea = b.i;
      else if (b.kind === "top") { if (cup.tea < 0) { flash = { text:"Tea first!", c:"#e03131", at:performance.now() }; return; } cup.top = b.i; }
      else if (b.kind === "ice") cup.ice = cup.ice === 1 ? 0 : 1;
      else if (b.kind === "bin") cup = { tea:-1, top:-1, ice:-1 };
      else if (b.kind === "serve") serve();
    }
    function click(e){
      var p = pt(cv, e);
      B.forEach(function(b){ if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) press(b); });
    }
    function kd(e){
      if (done) return;
      var k = e.key;
      if (k >= "1" && k <= "4") { press(B[+k - 1]); e.preventDefault(); }
      else if (k === "q" || k === "w" || k === "e") press(B[4 + "qwe".indexOf(k)]);
      else if (k === "i") press(B[7]);
      else if (k === "Backspace") { press(B[8]); e.preventDefault(); }
      else if (k === "Enter") { press(B[9]); e.preventDefault(); }
    }
    cv.addEventListener("pointerdown", click);
    cv.addEventListener("keydown", kd);

    function drawCup(x, y, s, c){
      /* c = {tea, top, ice}; s = scale */
      g.save(); g.translate(x, y); g.scale(s, s);
      g.beginPath(); g.moveTo(-34, -60); g.lineTo(34, -60); g.lineTo(26, 40); g.lineTo(-26, 40); g.closePath();
      g.fillStyle = "rgba(255,255,255,.55)"; g.fill();
      if (c.tea >= 0) {
        g.save(); g.clip();
        g.fillStyle = TEAS[c.tea].c; g.fillRect(-40, -44, 80, 90);
        if (c.ice === 1) { g.fillStyle = "rgba(255,255,255,.7)";
          [[-14,-34],[8,-28],[-4,-16],[16,-10]].forEach(function(q){ rrect(g, q[0], q[1], 13, 13, 3); g.fill(); }); }
        if (c.top >= 0) { g.fillStyle = TOPS[c.top].c;
          for (var i = 0; i < 14; i++) { var bx = -22 + (i % 7) * 7.5, by = 32 - Math.floor(i / 7) * 8;
            g.beginPath(); if (c.top === 2) g.rect(bx - 3, by - 3, 7, 6); else g.arc(bx, by, 3.6, 0, 7); g.fill(); } }
        g.restore();
      }
      g.strokeStyle = colour("--ink"); g.lineWidth = 2.5; g.stroke();
      g.fillStyle = "#c92a2a"; g.fillRect(6, -84, 6, 30);                     // straw
      g.fillStyle = colour("--ink"); rrect(g, -38, -64, 76, 6, 3); g.fill(); // lid
      g.restore();
    }
    function draw(now){
      g.fillStyle = colour("--paper"); g.fillRect(0, 0, 400, 400);
      var ink = colour("--ink");
      /* The customer and the order. */
      g.font = "34px system-ui"; g.textAlign = "center"; g.fillText("🧑", 40, 64);
      g.fillStyle = "#fff"; rrect(g, 70, 18, 170, 92, 12); g.fill(); g.strokeStyle = "#ccc"; g.lineWidth = 1; g.stroke();
      g.fillStyle = "#222"; g.textAlign = "left"; g.font = "bold 14px system-ui";
      g.fillText(order.who + " wants:", 82, 40);

  /* ---------- Noughts & Crosses against the computer ----------
     It plays well but not perfectly (one move in five is a guess), so

  function ttt(cv, g, setScore, finish, colour){
    var b, wins = 0, done = false, busy = false, msg = "", timer = null, cur = 4;
    var LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

      return s.indexOf("") < 0 ? "draw" : null; }
    function best(s, me){
      var w = winner(s); if (w === "O") return { v:1 }; if (w === "X") return { v:-1 }; if (w === "draw") return { v:0 };
      var out = { v: me === "O" ? -2 : 2, m:-1 };

        s[i] = me; var r = best(s, me === "O" ? "X" : "O"); s[i] = "";

      }

    }
    function fresh(){ b = ["", "", "", "", "", "", "", "", ""]; busy = false; msg = "You're X - your go"; draw(); }
    function end(w){
      if (w === "X") { wins++; setScore(wins); msg = "You win! Next game..."; }
      else if (w === "draw") msg = "A draw. Next game...";
      else { done = true; draw(); finish(wins, "The computer won. You won " + wins + (wins === 1 ? " game" : " games") + " in a row."); return; }
      draw(); busy = true; timer = setTimeout(fresh, 1100);
    }
    function play(i){
      if (done || busy || b[i]) return;
      b[i] = "X"; var w = winner(b); if (w) return end(w);
      busy = true; msg = "Thinking..."; draw();
      timer = setTimeout(function(){
        var free = []; b.forEach(function(v, j){ if (!v) free.push(j); });
        var m = Math.random() < 0.2 ? free[Math.floor(Math.random() * free.length)] : best(b, "O").m;
        b[m] = "O"; busy = false; msg = "Your go"; var w2 = winner(b); if (w2) end(w2); else draw();
      }, 350);
    }
    function pd(e){ var p = pt(cv, e); if (p.y < 50 || p.y > 380) return;
      var c = Math.floor((p.x - 50) / 100), r = Math.floor((p.y - 80) / 100);

      if (!done && !busy) { g.fillStyle = "rgba(232,89,12,.12)"; g.fillRect(55 + (cur % 3) * 100, 85 + Math.floor(cur / 3) * 100, 90, 90); }
      b.forEach(function(v, i){
        var x = 100 + (i % 3) * 100, y = 130 + Math.floor(i / 3) * 100;
        g.lineWidth = 7;
        if (v === "X") { g.strokeStyle = "#e8590c"; g.beginPath(); g.moveTo(x - 26, y - 26); g.lineTo(x + 26, y + 26); g.moveTo(x + 26, y - 26); g.lineTo(x - 26, y + 26); g.stroke(); }

  }

  /* ---------- Bomb Squad: find every safe square ----------
     Tap to open, hold (or right-click) to flag. The first square you
     open is never a bomb. Score = squares opened, plus a time bonus
     for clearing the board. */
  function mines(cv, g, setScore, finish, colour){
    var N = 9, BOMBS = 10, S = 40, OX = 20, OY = 30, cells = [], placed = false, done = false, opened = 0, t0 = 0, held = null, flagMode = false, timer = null;
    for (var i = 0; i < N*N; i++) cells.push({ bomb:false, open:false, flag:false, n:0 });
    function around(i, f){ var x = i % N, y = Math.floor(i / N);
      for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) { if (!dx && !dy) continue;
        var nx = x + dx, ny = y + dy; if (nx >= 0 && ny >= 0 && nx < N && ny < N) f(ny * N + nx); } }
    function place(safe){
      var keep = [safe]; around(safe, function(j){ keep.push(j); });
      var n = 0; while (n < BOMBS) { var r = Math.floor(Math.random() * N * N);
        if (!cells[r].bomb && keep.indexOf(r) < 0) { cells[r].bomb = true; n++; } }
      cells.forEach(function(c, j){ around(j, function(k){ if (cells[k].bomb) c.n++; }); });
      placed = true; t0 = performance.now();
    }
    function open(i){
      var c = cells[i]; if (c.open || c.flag) return;
      if (!placed) place(i);
      c.open = true;
      if (c.bomb) { done = true; cells.forEach(function(d){ if (d.bomb) d.open = true; }); draw(true);
        finish(opened, "Boom! You opened " + opened + " safe squares."); return; }
      opened++; setScore(opened);
      if (c.n === 0) around(i, function(j){ if (!cells[j].open && !cells[j].bomb) open(j); });
      if (!done && opened === N*N - BOMBS) {
        done = true; var secs = Math.round((performance.now() - t0) / 1000), s = opened + Math.max(0, 200 - secs);
        draw(); finish(s, "Cleared in " + secs + "s! " + s + " points."); }
    }
    function at(e){ var p = pt(cv, e), x = Math.floor((p.x - OX) / S), y = Math.floor((p.y - OY) / S);
      return x >= 0 && y >= 0 && x < N && y < N ? y * N + x : -1; }
    function flag(i){ if (i >= 0 && !cells[i].open) { cells[i].flag = !cells[i].flag; draw(); } }
    function pd(e){
      if (done) return;
      var p = pt(cv, e);

      var i = at(e); if (i < 0) return;
      if (e.button === 2) { flag(i); return; }

    }
    function pu(){ if (held == null || done) return; clearTimeout(timer); var i = held; held = null;

    function cm(e){ e.preventDefault(); }
    cv.addEventListener("pointerdown", pd); cv.addEventListener("pointerup", pu); cv.addEventListener("contextmenu", cm);
    var NC = ["", "#1c7ed6", "#2f9e44", "#e03131", "#5f3dc4", "#c92a2a", "#0c8599", "#222", "#868e96"];
    function draw(){
      var ink = colour("--ink");
      g.fillStyle = colour("--paper"); g.fillRect(0, 0, 400, 400);
      g.fillStyle = ink; g.font = "bold 13px system-ui"; g.textAlign = "left";
      var flags = cells.filter(function(c){ return c.flag; }).length;
      g.fillText("💣 " + (BOMBS - flags) + " left", 20, 19);
      g.textAlign = "right"; g.fillText(flagMode ? "🚩 Flag mode: ON" : "🚩 Flag mode: off", 380, 19);
      g.textAlign = "center";
      cells.forEach(function(c, i){
        var x = OX + (i % N) * S, y = OY + Math.floor(i / N) * S;
        g.fillStyle = c.open ? (c.bomb ? "#ffc9c9" : "rgba(127,127,127,.12)") : "#74c0fc";
        rrect(g, x + 2, y + 2, S - 4, S - 4, 6); g.fill();
        g.font = "bold 18px system-ui";
        if (c.open && c.bomb) g.fillText("💣", x + S/2, y + S/2 + 6);
        else if (c.open && c.n) { g.fillStyle = NC[c.n]; g.fillText(c.n, x + S/2, y + S/2 + 6); }
        else if (c.flag) g.fillText("🚩", x + S/2, y + S/2 + 6);
      });
      g.textAlign = "left";
    }
    draw();
    return function(){ done = true; clearTimeout(timer); cv.removeEventListener("pointerdown", pd); cv.removeEventListener("pointerup", pu); cv.removeEventListener("contextmenu", cm); };
  }

  /* ---------- Tower Stack: drop each block on the one below ---------- */
  function stack(cv, g, setScore, finish, colour){
    var H = 24, tower = [{ x:120, w:160 }], mv = { x:0, w:160, dir:1 }, speed = 2.4, done = false, raf = 0, last = 0, cut = null;
    function drop(){
      if (done) return;
      var top = tower[tower.length - 1], l = Math.max(mv.x, top.x), r = Math.min(mv.x + mv.w, top.x + top.w);
      if (r - l <= 0) { done = true; draw(); var s = tower.length - 1; finish(s, "Missed! Your tower was " + s + (s === 1 ? " block" : " blocks") + " high."); return; }
      cut = { x: mv.x < top.x ? mv.x : r, w: mv.w - (r - l), y: tower.length, a: 1 };
      if (Math.abs(mv.w - (r - l)) < 3) { l = top.x; r = top.x + top.w; cut = null; }   // near-perfect counts as perfect
      tower.push({ x:l, w:r - l });
      setScore(tower.length - 1);
      speed = Math.min(6, speed + 0.12);
      mv = { x: tower.length % 2 ? -(r - l) : 400, w: r - l, dir: tower.length % 2 ? 1 : -1 };
    }
    function kd(e){ if (e.key === " " || e.key === "Enter" || e.key === "ArrowDown") { e.preventDefault(); drop(); } }
    function pd(){ drop(); }
    cv.addEventListener("keydown", kd); cv.addEventListener("pointerdown", pd);
    function hue(i){ return "hsl(" + ((i * 23) % 360) + ",70%,60%)"; }
    function draw(){
      g.fillStyle = colour("--paper"); g.fillRect(0, 0, 400, 400);
      var shift = Math.max(0, tower.length - 11) * H;
      tower.forEach(function(b, i){ g.fillStyle = hue(i); g.fillRect(b.x, 390 - (i + 1) * H + shift, b.w, H - 2); });
      if (cut && cut.a > 0) { g.globalAlpha = cut.a; g.fillStyle = hue(cut.y); g.fillRect(cut.x, 390 - (cut.y + 1) * H + shift + (1 - cut.a) * 80, cut.w, H - 2); g.globalAlpha = 1; }
      if (!done) { g.fillStyle = hue(tower.length); g.fillRect(mv.x, 390 - (tower.length + 1) * H + shift, mv.w, H - 2); }
      g.fillStyle = colour("--ink"); g.font = "bold 22px system-ui"; g.textAlign = "center"; g.fillText(tower.length - 1, 200, 36); g.textAlign = "left";
    }
    function frame(now){
      if (done) return;
      var k = last ? Math.min(2, (now - last) / 16.7) : 1; last = now;
      mv.x += mv.dir * speed * k;
      if (mv.x + mv.w > 420 && mv.dir > 0) mv.dir = -1;
      if (mv.x < -20 && mv.dir < 0) mv.dir = 1;

      raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);
    return function(){ done = true; cancelAnimationFrame(raf); cv.removeEventListener("keydown", kd); cv.removeEventListener("pointerdown", pd); };
  }

  /* ---------- Quick Draw: how fast are your reactions? ----------
     Five rounds. Wait for green, then tap. Each round scores up to 500
     (faster = more); tapping too early scores nothing. */
  function quick(cv, g, setScore, finish, colour){
    var round = 0, total = 0, state = "wait", go = 0, timer = null, done = false, times = [], note = "";
    function arm(){
      round++; state = "wait"; note = ""; draw();
      timer = setTimeout(function(){ state = "go"; go = performance.now(); draw(); }, 1300 + Math.random() * 2700);
    }
    function hit(){
      if (done) return;
      if (state === "wait") { clearTimeout(timer); state = "early"; note = "Too soon! 0 points"; times.push(null); draw(); timer = setTimeout(next, 1100); }
      else if (state === "go") { var ms = Math.round(performance.now() - go); times.push(ms); total += Math.max(0, 500 - ms); setScore(total);
        state = "done"; note = ms + " ms"; draw(); timer = setTimeout(next, 1100); }
    }
    function next(){
      if (round >= 5) { done = true; var ok = times.filter(function(t){ return t != null; });
        var avg = ok.length ? Math.round(ok.reduce(function(a, b){ return a + b; }, 0) / ok.length) : 0;
        draw(); finish(total, "Done! " + total + " points" + (avg ? ", average " + avg + " ms." : ".")); return; }
      arm();
    }
    function kd(e){ if ((e.key === " " || e.key === "Enter") && !done) { e.preventDefault(); hit(); } }
    function pd(){ hit(); }
    cv.addEventListener("keydown", kd); cv.addEventListener("pointerdown", pd);
    function draw(){
      g.fillStyle = state === "go" ? "#2f9e44" : state === "early" ? "#e03131" : colour("--paper");
      g.fillRect(0, 0, 400, 400);
      g.fillStyle = state === "go" || state === "early" ? "#fff" : colour("--ink");
      g.textAlign = "center"; g.font = "bold 30px system-ui";
      g.fillText(state === "go" ? "TAP!" : state === "wait" ? "Wait for green..." : note, 200, 200);
      g.font = "15px system-ui"; g.fillText("Round " + Math.min(round, 5) + " of 5", 200, 240);
      g.textAlign = "left";
    }
    arm();
    return function(){ done = true; clearTimeout(timer); cv.removeEventListener("keydown", kd); cv.removeEventListener("pointerdown", pd); };
  }

  if (window.GamesGate && GamesGate.ready) GamesGate.ready.then(function(ok){ if (ok) go(); }); else go();
})();
</script>
